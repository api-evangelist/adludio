name: Adludio Packages
description: >-
  First-party npm packages published by Adludio (originally Future Ad Labs) under the
  @adludio scope and the shared "adludio-dev" npm maintainer account. IMPORTANT: none of
  these is an API client SDK. They are internal open-source building blocks for the
  company's interactive ad runtime (observables, finite state machines, 2D geometry) plus
  one internal outsourcing tool. Adludio never published a public API, so there is no
  client library to wrap one. Every package is abandoned: the newest release across the
  whole scope is 2019-09-26, and ADLUDIO LIMITED (UK company 08227542) entered
  administration on 2024-08-23 and moved into creditors voluntary liquidation on
  2025-08-28.
