name: adludio
description: 'Adludio is an AI-powered interactive mobile advertising company founded
  in 2015 in London by Paul Coggins (originally Future Ad Labs). Its "Sensory Ad Science"
  platform builds rich, interactive mobile ad units using touch, motion and haptic
  interaction, sold on a cost-per-engagement rather than CPM model, with brand clients
  including Nike, Microsoft, Coca-Cola and Estee Lauder. The company was backed by
  Balderton Capital. As of 2026 the adludio.com domain 301-redirects to permate.com
  (an unrelated Vietnamese partnership-automation platform), indicating the original
  company is no longer operating a public web presence; no public API or developer
  surface was found during enrichment.'
