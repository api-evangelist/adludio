name: adludio
description: 'Adludio was an AI-powered interactive mobile advertising company founded
  in 2015 in London by Paul Coggins (originally Future Ad Labs). Its "Sensory Ad Science"
  platform built rich, interactive mobile ad units using touch, motion and haptic
  interaction, sold on a cost-per-engagement rather than CPM model, with brand clients
  including Nike, Microsoft, Coca-Cola and Estee Lauder. The company was backed by
  Balderton Capital. Adludio is now defunct: ADLUDIO LIMITED (UK company number 08227542)
  entered administration on 2024-08-23 and moved into creditors voluntary liquidation on
  2025-08-28. The adludio.com domain 301-redirects to permate.com (an unrelated
  partnership-automation platform), no api/docs/developer subdomain resolves, and the
  residual adludio.webflow.io marketing mirror now returns 404. Adludio never published a
  public API, developer portal or machine-readable contract; the only surviving developer
  artifacts are four abandoned first-party npm packages under the @adludio scope
  (interactive ad-runtime building blocks, not API clients), none released since 2019.'
